name: Tests
on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/**'
      - 'gradle/**'
      - 'samples/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'generic-datastore-core/build.gradle.kts'
      - 'generic-datastore-core/src/**'
      - 'generic-datastore-preferences/build.gradle.kts'
      - 'generic-datastore-preferences/src/**'
      - 'generic-datastore-proto/build.gradle.kts'
      - 'generic-datastore-proto/src/**'
      - 'generic-datastore/build.gradle.kts'
      - 'generic-datastore/src/**'
      - 'generic-datastore-compose/build.gradle.kts'
      - 'generic-datastore-compose/src/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'gradle/**'
      - 'samples/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'generic-datastore-core/build.gradle.kts'
      - 'generic-datastore-core/src/**'
      - 'generic-datastore-preferences/build.gradle.kts'
      - 'generic-datastore-preferences/src/**'
      - 'generic-datastore-proto/build.gradle.kts'
      - 'generic-datastore-proto/src/**'
      - 'generic-datastore/build.gradle.kts'
      - 'generic-datastore/src/**'
      - 'generic-datastore-compose/build.gradle.kts'
      - 'generic-datastore-compose/src/**'
  workflow_dispatch:

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC"'

concurrency:
  group: ${{ github.ref }}-test
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  Test-Desktop:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Project
        uses: $/.github/actions/setup-project

      - name: Run Generic Datastore Core tests
        run: |
          ./gradlew :generic-datastore-core:jvmTest --parallel

      - name: Run Generic Datastore Preferences tests
        run: |
          ./gradlew :generic-datastore-preferences:jvmTest --parallel

      - name: Run Generic Datastore Proto tests
        if: ${{ !cancelled() }}
        run: |
          ./gradlew :generic-datastore-proto:jvmTest --parallel

      - name: Run Generic Datastore Compose tests
        if: ${{ !cancelled() }}
        run: |
          ./gradlew :generic-datastore-compose:jvmTest --parallel

  Test-iOS:
    timeout-minutes: 15
    runs-on: macos-latest
    steps:
      - name: Setup Project
        uses: $/.github/actions/setup-project

      - name: Cache Kotlin/Native
        uses: actions/cache@v6.1.0
        with:
          path: ~/.konan
          key: konan-test-ios-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-test-ios


      - name: Run Generic Datastore Core tests
        run: |
          ./gradlew :generic-datastore-core:iosSimulatorArm64Test --parallel

      - name: Run Generic Datastore Preferences tests
        run: |
          ./gradlew :generic-datastore-preferences:iosSimulatorArm64Test --parallel

      - name: Run Generic Datastore Proto tests
        if: ${{ !cancelled() }}
        run: |
          ./gradlew :generic-datastore-proto:iosSimulatorArm64Test --parallel

      - name: Run Generic Datastore Compose tests
        if: ${{ !cancelled() }}
        run: |
          ./gradlew :generic-datastore-compose:iosSimulatorArm64Test --parallel

  Test-Android:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      api-level: 35
    steps:
      - name: Setup Project
        uses: $/.github/actions/setup-project

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: AVD cache
        uses: actions/cache@v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.api-level }}

      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ env.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run Generic Datastore Preferences tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ env.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :generic-datastore-preferences:connectedAndroidDeviceTest

      - name: Run Generic Datastore Proto tests
        if: ${{ !cancelled() }}
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ env.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :generic-datastore-proto:connectedAndroidDeviceTest

      - name: Run Generic Datastore Compose tests
        if: ${{ !cancelled() }}
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ env.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :generic-datastore-compose:connectedAndroidDeviceTest
